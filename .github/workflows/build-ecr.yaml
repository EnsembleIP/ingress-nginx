# Build the patched controller (nginx 1.31.9, QD-10940) and push it to the
# staging / production ECR repos. AWS auth is OIDC via the existing
# ensembleip-github-actions-deploy role (allowlisted in ensembleip-infra
# terraform by repo:EnsembleIP/ingress-nginx:environment:<env>).
name: Build and push images to ECR

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "AWS environment to push to"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write # OIDC token for AWS AssumeRole + cosign keyless signing

concurrency:
  group: build-ecr
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  # Digest-pinned upstream kube-webhook-certgen from the infra runbook.
  CERTGEN_REF: registry.k8s.io/ingress-nginx/kube-webhook-certgen:v1.6.9@sha256:01038e7de14b78d702d2849c3aad72fd25903c4765af63cf16aa3398f5d5f2dd

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      go_version: ${{ steps.ver.outputs.go_version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          short="${GITHUB_SHA::7}"
          # TAG already starts with "v"; do not prefix another one.
          echo "version=$(cat TAG)-nginx-1.31.9-eip.${short}" >> "$GITHUB_OUTPUT"
          echo "go_version=$(cat GOLANG_VERSION)" >> "$GITHUB_OUTPUT"

  # Pushes to the staging account on every push to the default branch, and on
  # explicit dispatch. The production job must be dispatched manually.
  push-staging:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    needs: resolve
    environment: staging
    runs-on: ubuntu-24.04
    env:
      ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID_STAGING || '339652154195' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/ensembleip-github-actions-deploy
          role-session-name: ingress-nginx-ci
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Cache nginx base build
        uses: actions/cache@v4
        with:
          path: .buildx-cache
          key: nginx-base-${{ hashFiles('images/nginx/rootfs/**') }}
          restore-keys: nginx-base-
      - name: Build nginx base (nginx 1.31.9, all sources sha256-verified)
        uses: docker/build-push-action@v6
        with:
          context: images/nginx/rootfs
          load: true
          push: false
          platforms: linux/amd64
          tags: local/nginx-base:build
          cache-from: type=local,src=.buildx-cache
          cache-to: type=local,dest=.buildx-cache,mode=max
      - name: Verify nginx version in base
        run: docker run --rm local/nginx-base:build nginx -v 2>&1 | grep -q 'nginx/1.31.9'
      - name: Build controller binaries
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -e PKG=k8s.io/ingress-nginx -e ARCH=amd64 -e CGO_ENABLED=0 \
            -e GOFLAGS=-buildvcs=false \
            -e TAG='${{ needs.resolve.outputs.version }}' \
            -e COMMIT_SHA="$GITHUB_SHA" \
            -e REPO_INFO="https://github.com/${GITHUB_REPOSITORY}" \
            golang:${{ needs.resolve.outputs.go_version }}-alpine3.23 \
            /bin/sh build/build.sh
      - name: Build and push controller image
        id: controller
        # Classic builder on purpose: the nginx base was imported into the
        # docker image store (buildx load: true). The buildx builder's own
        # containerd cannot see it as a FROM base.
        run: |
          IMG="${{ steps.ecr.outputs.registry }}/ingress-nginx-controller:${{ needs.resolve.outputs.version }}"
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE=local/nginx-base:build \
            --build-arg VERSION='${{ needs.resolve.outputs.version }}' \
            --build-arg TARGETARCH=amd64 \
            --build-arg COMMIT_SHA='${{ github.sha }}' \
            --build-arg BUILD_ID='${{ github.run_id }}' \
            -t "$IMG" rootfs
          # Capture the pushed digest from docker's own output: the deploy role
          # has no ecr:DescribeImages permission, and signing what we just
          # pushed is exactly right anyway.
          docker push "$IMG" 2>&1 | tee /tmp/controller-push.log
          echo "CONTROLLER_DIGEST=$(awk '/digest: sha256:/{for(i=1;i<=NF;i++) if($i ~ /^sha256:[0-9a-f]+$/) print $i}' /tmp/controller-push.log)" >> "$GITHUB_ENV"
      - name: Mirror kube-webhook-certgen to ECR
        run: |
          # Registry-to-registry copy by digest: no local tag needed, and the
          # full multi-arch manifest list (same digest as upstream) is preserved.
          docker buildx imagetools create \
            -t "${{ steps.ecr.outputs.registry }}/ingress-nginx-certgen:v1.6.9" \
            "$CERTGEN_REF" 2>&1 | tee /tmp/certgen-push.log
          echo "CERTGEN_DIGEST=$(awk '/pushing sha256:/{for(i=1;i<=NF;i++) if($i ~ /^sha256:/) print $i}' /tmp/certgen-push.log)" >> "$GITHUB_ENV"
      - name: Sign images (cosign keyless) and attach SBOM
        run: |
          curl -sSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 && chmod +x /usr/local/bin/cosign
          # docker sbom was removed from the Docker CLI in 28.x; pinned syft generates the SPDX document instead.
          curl -sSL https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz | tar xz -C /usr/local/bin syft
          for img in \
            "${{ steps.ecr.outputs.registry }}/ingress-nginx-controller@$CONTROLLER_DIGEST" \
            "${{ steps.ecr.outputs.registry }}/ingress-nginx-certgen@$CERTGEN_DIGEST"; do
            cosign sign -y "$img"
            syft "registry:$img" --output spdx-json=sbom.spdx.json
            cosign attest -y --predicate sbom.spdx.json --type spdxjson "$img"
          done
      - name: Write digest summary (for terraform.tfvars)
        run: |
          digest=$CONTROLLER_DIGEST
          {
            echo "## tfvars snippet"
            echo '```'
            echo "ingress_controller_image = { staging = \"${{ steps.ecr.outputs.registry }}/ingress-nginx-controller:${{ needs.resolve.outputs.version }}@$digest\" }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  push-production:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    needs: resolve
    environment: production
    runs-on: ubuntu-24.04
    env:
      ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID_PRODUCTION || '851725459092' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/ensembleip-github-actions-deploy
          role-session-name: ingress-nginx-ci
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Cache nginx base build
        uses: actions/cache@v4
        with:
          path: .buildx-cache
          key: nginx-base-${{ hashFiles('images/nginx/rootfs/**') }}
          restore-keys: nginx-base-
      - name: Build nginx base
        uses: docker/build-push-action@v6
        with:
          context: images/nginx/rootfs
          load: true
          push: false
          platforms: linux/amd64
          tags: local/nginx-base:build
          cache-from: type=local,src=.buildx-cache
          cache-to: type=local,dest=.buildx-cache,mode=max
      - name: Verify nginx version in base
        run: docker run --rm local/nginx-base:build nginx -v 2>&1 | grep -q 'nginx/1.31.9'
      - name: Build controller binaries
        run: |
          docker run --rm -v "$PWD":/work -w /work \
            -e PKG=k8s.io/ingress-nginx -e ARCH=amd64 -e CGO_ENABLED=0 \
            -e GOFLAGS=-buildvcs=false \
            -e TAG='${{ needs.resolve.outputs.version }}' \
            -e COMMIT_SHA="$GITHUB_SHA" \
            -e REPO_INFO="https://github.com/${GITHUB_REPOSITORY}" \
            golang:${{ needs.resolve.outputs.go_version }}-alpine3.23 \
            /bin/sh build/build.sh
      - name: Build and push controller image
        # Classic builder on purpose: the nginx base was imported into the
        # docker image store (buildx load: true). The buildx builder's own
        # containerd cannot see it as a FROM base.
        run: |
          IMG="${{ steps.ecr.outputs.registry }}/ingress-nginx-controller:${{ needs.resolve.outputs.version }}"
          docker build --platform linux/amd64 \
            --build-arg BASE_IMAGE=local/nginx-base:build \
            --build-arg VERSION='${{ needs.resolve.outputs.version }}' \
            --build-arg TARGETARCH=amd64 \
            --build-arg COMMIT_SHA='${{ github.sha }}' \
            --build-arg BUILD_ID='${{ github.run_id }}' \
            -t "$IMG" rootfs
          # Capture the pushed digest from docker's own output: the deploy role
          # has no ecr:DescribeImages permission, and signing what we just
          # pushed is exactly right anyway.
          docker push "$IMG" 2>&1 | tee /tmp/controller-push.log
          echo "CONTROLLER_DIGEST=$(awk '/digest: sha256:/{for(i=1;i<=NF;i++) if($i ~ /^sha256:[0-9a-f]+$/) print $i}' /tmp/controller-push.log)" >> "$GITHUB_ENV"
      - name: Mirror kube-webhook-certgen to ECR
        run: |
          # Registry-to-registry copy by digest: no local tag needed, and the
          # full multi-arch manifest list (same digest as upstream) is preserved.
          docker buildx imagetools create \
            -t "${{ steps.ecr.outputs.registry }}/ingress-nginx-certgen:v1.6.9" \
            "$CERTGEN_REF" 2>&1 | tee /tmp/certgen-push.log
          echo "CERTGEN_DIGEST=$(awk '/pushing sha256:/{for(i=1;i<=NF;i++) if($i ~ /^sha256:/) print $i}' /tmp/certgen-push.log)" >> "$GITHUB_ENV"
      - name: Sign images (cosign keyless) and attach SBOM
        run: |
          curl -sSL -o /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 && chmod +x /usr/local/bin/cosign
          # docker sbom was removed from the Docker CLI in 28.x; pinned syft generates the SPDX document instead.
          curl -sSL https://github.com/anchore/syft/releases/download/v1.57.2/syft_1.57.2_linux_amd64.tar.gz | tar xz -C /usr/local/bin syft
          for img in \
            "${{ steps.ecr.outputs.registry }}/ingress-nginx-controller@$CONTROLLER_DIGEST" \
            "${{ steps.ecr.outputs.registry }}/ingress-nginx-certgen@$CERTGEN_DIGEST"; do
            cosign sign -y "$img"
            syft "registry:$img" --output spdx-json=sbom.spdx.json
            cosign attest -y --predicate sbom.spdx.json --type spdxjson "$img"
          done
      - name: Write digest summary (for terraform.tfvars)
        run: |
          digest=$CONTROLLER_DIGEST
          {
            echo "## tfvars snippet"
            echo '```'
            echo "ingress_controller_image = { production = \"${{ steps.ecr.outputs.registry }}/ingress-nginx-controller:${{ needs.resolve.outputs.version }}@$digest\" }"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
